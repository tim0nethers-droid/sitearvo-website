<html lang="en">

    <title>You're Offline | SiteArvo</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,rgba(245,168,0,.13),transparent 42%),#080a0d;color:#b8bec7;font-family:Inter,system-ui,sans-serif;text-align:center}.offline-card{width:min(100%,440px);padding:42px 30px;border:1px solid rgba(245,168,0,.22);border-radius:24px;background:#10141a;box-shadow:0 30px 80px rgba(0,0,0,.4)}img{width:82px;height:82px;object-fit:contain;margin:0 auto 22px;border-radius:20px}small{color:#ffc94a;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:12px 0;color:#fff;font-size:clamp(2rem,9vw,3rem);letter-spacing:-.04em}p{margin:0 auto 28px;max-width:320px;line-height:1.7}button{min-height:48px;padding:0 22px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffd15c,#f5a800,#e87500);color:#120e07;font:800 .92rem inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffc94a;outline-offset:3px}

  </head>
  <body>
    <main class="offline-card"><img src="/icons/icon-192.png" alt="SiteArvo logo" /><small>SiteArvo</small><h1>You're Offline</h1><p>Please check your internet connection and try again.</p><button type="button" onclick="window.location.reload()">Try Again</button></main>
